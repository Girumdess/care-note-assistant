name: UI preview

# Runs the app on a pull request and saves screenshots of every tab, so a
# change to the interface can be reviewed before it reaches the live demo.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start the app
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - name: Take screenshots
        run: python .github/scripts/screenshot_tabs.py
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
